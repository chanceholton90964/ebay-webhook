services:
  - type: web
    name: ebay-webhook
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: VERIFICATION_TOKEN
        value: abcdef1234567890abcdef1234567890
      - key: ENDPOINT_URL
        value: https://ebay-webhook.onrender.com/ebay-webhook
